services:
  # Gateway mode. Kaseya BMS credentials arrive per request on
  # X-Kaseya-BMS-Tenant-Subdomain and X-Kaseya-BMS-API-Token or
  # X-Kaseya-BMS-K1-Token. Do not set KASEYA_BMS_TENANT_SUBDOMAIN,
  # KASEYA_BMS_API_TOKEN, KASEYA_BMS_K1_TOKEN, or env_file here — that
  # would put static vendor credentials in the container. The project .env
  # is used only for Compose interpolation of CONDUIT_S2S_SECRET. For
  # AUTH_MODE=env, pass the KASEYA_BMS_* variables on that process instead
  # (see the README).
  kaseya-bms-mcp:
    build:
      context: .
      secrets:
        - npmrc
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - NODE_ENV=production
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

secrets:
  npmrc:
    file: ./.npmrc
